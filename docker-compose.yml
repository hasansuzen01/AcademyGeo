name: academygeo

# Every value comes from backend/.env and frontend/.env.local, so there is no
# extra env file at the repository root. Copy the two examples before the
# first `docker compose up`:
#   cp backend/.env.example backend/.env
#   cp frontend/.env.example frontend/.env.local

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: academygeo
      POSTGRES_PASSWORD: academygeo
      POSTGRES_DB: academygeo
    # 5433 and 6380 keep clear of a Postgres or Redis already on the defaults.
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U academygeo']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6380:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Secrets, admin addresses and the R2 keys all come straight from here.
    env_file:
      - ./backend/.env
    # These override the file: inside the network the services answer on their
    # own names and default ports, not on the host ports above.
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://academygeo:academygeo@postgres:5432/academygeo?schema=public
      REDIS_URL: redis://redis:6379
      API_URL: http://localhost:3001
      BETTER_AUTH_URL: http://localhost:3001
      WEB_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
    ports:
      - '3001:3001'

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # NEXT_PUBLIC_MEDIA_HOST is not listed: the build reads it, and anything
      # else it needs, from frontend/.env.local.
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_AUTH_URL: http://localhost:3001
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - '3000:3000'

volumes:
  postgres-data:
  redis-data:
