name: academygeo

# The local stack. Production runs on Coolify, which builds the same two
# Dockerfiles and supplies Postgres and Redis as its own managed resources.
#
# Every value comes from backend/.env, so there is no extra env file at the
# repository root. Copy the example before the first `docker compose up`:
#   cp backend/.env.example backend/.env

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: academygeo
      POSTGRES_PASSWORD: academygeo
      POSTGRES_DB: academygeo
    # Bound to the loopback: these credentials are for a laptop, and a
    # database reachable from the network with them is a database given away.
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U academygeo']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Secrets, admin addresses and the R2 keys all come straight from here.
    env_file:
      - ./backend/.env
    # These override the file: inside the network the services answer on their
    # own names and default ports, not on the host ports above.
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://academygeo:academygeo@postgres:5432/academygeo?schema=public
      REDIS_URL: redis://redis:6379
      API_URL: http://localhost:3001
      BETTER_AUTH_URL: http://localhost:3001
      WEB_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
    ports:
      - '3001:3001'

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # Everything the browser is told is baked in at build time, so these are
      # arguments rather than environment. Rebuild after changing one.
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_AUTH_URL: http://localhost:3001
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        NEXT_PUBLIC_MEDIA_HOST: ${NEXT_PUBLIC_MEDIA_HOST:-}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      # The browser cannot reach the compose network, but the server can, and
      # it is the faster way in for anything rendered on the server.
      INTERNAL_API_URL: http://backend:3001
    ports:
      - '3000:3000'

volumes:
  postgres-data:
  redis-data:
