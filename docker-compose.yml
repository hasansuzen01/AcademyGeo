name: academygeo

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-academygeo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-academygeo}
      POSTGRES_DB: ${POSTGRES_DB:-academygeo}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-academygeo}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-academygeo}:${POSTGRES_PASSWORD:-academygeo}@postgres:5432/${POSTGRES_DB:-academygeo}?schema=public
      REDIS_URL: redis://redis:6379
      API_URL: http://localhost:${API_PORT:-3001}
      BETTER_AUTH_URL: http://localhost:${API_PORT:-3001}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      WEB_URL: http://localhost:${WEB_PORT:-3000}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      # Whoever signs in with one of these addresses becomes an admin. Without
      # it a fresh container has no admin and nobody can reach /admin.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Uploads go straight from the browser to R2; the API only signs them.
      # Leave blank and the upload endpoint says storage is not configured.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
    ports:
      - '${API_PORT:-3001}:3001'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3001}
        NEXT_PUBLIC_AUTH_URL: http://localhost:${API_PORT:-3001}
        NEXT_PUBLIC_APP_URL: http://localhost:${WEB_PORT:-3000}
        NEXT_PUBLIC_MEDIA_HOST: ${NEXT_PUBLIC_MEDIA_HOST:-}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - '${WEB_PORT:-3000}:3000'

volumes:
  postgres-data:
  redis-data:
